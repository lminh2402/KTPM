<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DC143C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B008B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Letter L - thick vertical bar and horizontal base -->
  <rect x="30" y="30" width="25" height="100" fill="url(#logoGradient)"/>
  <rect x="30" y="105" width="50" height="25" fill="url(#logoGradient)"/>
  
  <!-- Letter V - two diagonal strokes meeting at bottom -->
  <path d="M 95 30 L 120 100 L 145 30" 
        stroke="url(#logoGradient)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  <path d="M 120 100 L 135 30" 
        stroke="url(#logoGradient)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Decorative curved flourish from V -->
  <path d="M 145 100 Q 155 90 165 95 Q 175 100 170 110 Q 165 120 155 115 Q 145 110 145 100" 
        stroke="url(#logoGradient)" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round"/>
  <path d="M 170 110 Q 180 105 185 115" 
        stroke="url(#logoGradient)" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Subtle connecting line between L and V -->
  <line x1="80" y1="130" x2="120" y2="100" 
        stroke="url(#logoGradient)" 
        stroke-width="3" 
        opacity="0.6"/>
</svg>






