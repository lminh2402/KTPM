# Production Database Configuration (from environment variables)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/new}
spring.datasource.username=root
spring.datasource.password=240205
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=JWT_SECRET:your-secret-key-here-make-it-long-and-secure-in-production
jwt.expiration=86400000

# Logging Configuration for Production
logging.level.org.springframework.security=WARN
logging.level.com.bluemoon.fees=INFO
# logging.level.root=INFO
# logging.level.org.springframework.boot.autoconfigure=DEBUG

# CORS Configuration
spring.web.cors.allowed-origins=${CORS_ORIGINS:*}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Server Configuration
server.port=${PORT:8080}
